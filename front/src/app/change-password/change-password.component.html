<div class="auth-wrap">
  <div class="card auth-card">
    <h2 class="h2">Promena lozinke</h2>

    <form (ngSubmit)="promeniLozinku()" class="form-stack">
      <div class="form-group">
        <label for="old-pass">Stara lozinka</label>
        <input id="old-pass" class="input" type="password" [(ngModel)]="oldPassword" name="oldPassword" />
      </div>

      <div class="form-group">
        <label for="new-pass">Nova lozinka</label>
        <input id="new-pass" class="input" type="password" [(ngModel)]="newPassword" name="newPassword" />
      </div>

      <div class="form-group">
        <label for="new-pass2">Ponovi novu lozinku</label>
        <input id="new-pass2" class="input" type="password" [(ngModel)]="newPassword2" name="newPassword2" />
      </div>

      @if (msg) {
        <p [ngClass]="ok ? 'status-success' : 'status-error'">{{ msg }}</p>
      }

      <button class="btn" type="submit" [disabled]="loading">
        {{ loading ? 'Menjanje...' : 'Sačuvaj promenu' }}
      </button>
    </form>
  </div>
</div>
